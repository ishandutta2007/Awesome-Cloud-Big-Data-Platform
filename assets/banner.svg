<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse-line {
        stroke-dasharray: 10 15;
        animation: dash 20s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .spark-float {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Background Network Graphics (behind text) -->
  <g opacity="0.25">
    <path class="pulse-line" d="M 50 150 Q 300 50 600 150 T 1150 150" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="pulse-line" d="M 100 220 Q 400 280 800 120 T 1100 200" fill="none" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Animated background particles/nodes -->
    <circle cx="150" cy="80" r="40" fill="#0284c7" opacity="0.3" class="node-pulse"/>
    <circle cx="1050" cy="220" r="60" fill="#7c3aed" opacity="0.3" class="node-pulse"/>
    <circle cx="920" cy="70" r="35" fill="#06b6d4" opacity="0.3" class="node-pulse"/>
    <circle cx="200" cy="230" r="45" fill="#4f46e5" opacity="0.3" class="node-pulse"/>
  </g>

  <!-- Content Container (Guaranteed Foreground Layering) -->
  <!-- Header Title -->
  <g transform="translate(600, 95)" text-anchor="middle">
    <text class="title-text" fill="url(#textGrad)" filter="url(#glow)">Awesome Cloud Big Data Platform</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <text class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Distributed Data Engineering Tools</text>
  </g>

  <!-- Tech Stack Pills (Foreground Badges) -->
  <g transform="translate(180, 195)">
    <!-- Spark -->
    <g transform="translate(0, 0)" class="spark-float">
      <rect width="130" height="36" rx="18" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="23" text-anchor="middle" class="pill-text">⚡ Apache Spark</text>
    </g>
    <!-- Databricks -->
    <g transform="translate(150, 0)" class="spark-float" style="animation-delay: 0.5s;">
      <rect width="130" height="36" rx="18" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="65" y="23" text-anchor="middle" class="pill-text">🧱 Databricks</text>
    </g>
    <!-- Trino -->
    <g transform="translate(300, 0)" class="spark-float" style="animation-delay: 1s;">
      <rect width="110" height="36" rx="18" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="55" y="23" text-anchor="middle" class="pill-text">🎯 Trino</text>
    </g>
    <!-- Flink -->
    <g transform="translate(430, 0)" class="spark-float" style="animation-delay: 1.5s;">
      <rect width="130" height="36" rx="18" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="23" text-anchor="middle" class="pill-text">🐿️ Apache Flink</text>
    </g>
    <!-- Iceberg -->
    <g transform="translate(580, 0)" class="spark-float" style="animation-delay: 2s;">
      <rect width="130" height="36" rx="18" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="65" y="23" text-anchor="middle" class="pill-text">🧊 Apache Iceberg</text>
    </g>
    <!-- Delta Lake -->
    <g transform="translate(730, 0)" class="spark-float" style="animation-delay: 2.5s;">
      <rect width="110" height="36" rx="18" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="55" y="23" text-anchor="middle" class="pill-text">🔺 Delta Lake</text>
    </g>
  </g>
</svg>
